# Pings the site every 10 minutes so Render's free tier never spins the
# service down. While spun down, Render's edge answers /robots.txt with a
# blocking "Disallow: /" fallback, which stops Google from indexing the site.
name: Keep Render service awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://www.imperial-go.org/health)
          echo "Health check returned HTTP $status"
          test "$status" = "200"
